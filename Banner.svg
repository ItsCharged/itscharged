<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250">
  <defs>
    <style>
      /* Pulsierender Effekt für den Namen */
      @keyframes pulse {
        0% { text-shadow: 0 0 5px #F7DF1E, 0 0 10px #F7DF1E; transform: scale(1); }
        50% { text-shadow: 0 0 20px #F7DF1E, 0 0 30px #F7DF1E, 0 0 40px #ffaa00; transform: scale(1.02); }
        100% { text-shadow: 0 0 5px #F7DF1E, 0 0 10px #F7DF1E; transform: scale(1); }
      }
      /* Ladebalken Animation */
      @keyframes charge {
        0% { width: 0; fill: #ff0000; }
        50% { fill: #F7DF1E; }
        100% { width: 380px; fill: #00ff00; }
      }
      .title { font-family: 'Courier New', monospace; font-size: 50px; fill: #fff; font-weight: bold; animation: pulse 2s infinite; transform-origin: center; }
      .subtitle { font-family: 'Courier New', monospace; font-size: 22px; fill: #F7DF1E; font-weight: bold;}
      .bar { animation: charge 3s ease-in-out infinite alternate; }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117" rx="15" />
  
  <text x="50%" y="35%" text-anchor="middle" class="title">itscharged</text>
  <text x="50%" y="55%" text-anchor="middle" class="subtitle">⚡ charged Up to 2000V ⚡</text>

  <rect x="200" y="160" width="400" height="30" fill="none" stroke="#555" stroke-width="4" rx="5" />
  <rect x="605" y="168" width="10" height="14" fill="#555" rx="2" />
  <rect x="204" y="164" width="0" height="22" class="bar" rx="3" />
</svg>
